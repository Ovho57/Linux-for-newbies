name: Build desktop packages
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  package:
    strategy:
      matrix:
        include:
          - os: windows-latest
            artifact: NeuralForge-Windows
          - os: ubuntu-latest
            artifact: NeuralForge-Linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install application
        run: |
          python -m pip install --upgrade pip
          pip install .
          pip install pyinstaller
      - name: Build executable
        run: pyinstaller --noconfirm --clean --windowed --name NeuralForge main.py
      - name: Archive Windows build
        if: runner.os == 'Windows'
        run: Compress-Archive -Path dist/NeuralForge -DestinationPath NeuralForge-Windows.zip
        shell: pwsh
      - name: Archive Linux build
        if: runner.os == 'Linux'
        run: tar -czf NeuralForge-Linux.tar.gz -C dist NeuralForge
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ runner.os == 'Windows' && 'NeuralForge-Windows.zip' || 'NeuralForge-Linux.tar.gz' }}
      - name: Publish unsigned release assets
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ runner.os == 'Windows' && 'NeuralForge-Windows.zip' || 'NeuralForge-Linux.tar.gz' }}
